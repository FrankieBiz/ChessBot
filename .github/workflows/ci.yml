name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build extension packages
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check packages
        run: |
          version=$(node -p "require('./package.json').version")
          for browser in chrome firefox; do
            archive="dist/chessbot-${browser}-v${version}.zip"
            test -f "$archive"
            unzip -l "$archive" | grep -q " manifest.json$"
            unzip -l "$archive" | grep -q " LICENSE$"
            test "$(unzip -p "$archive" manifest.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")" = "$version"
            echo "$archive: $(du -h "$archive" | cut -f1)"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: chessbot-extensions
          path: dist/*.zip
          retention-days: 7
